<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Em có đồng ý đi cùng anh không? 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #ec4899;
  --bg: linear-gradient(135deg, #fff5f7 0%, #fce7f3 40%, #f3e8ff 100%);
  --card: rgba(255,255,255,0.8);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: #4a2c4a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.hearts-container {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 0;
}
.heart {
  position: absolute; font-size: 20px; color: #ffb6c1;
  animation: floatUp linear infinite; opacity: 0.7;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.8; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}
.card {
  background: var(--card);
  backdrop-filter: blur(12px);
  border-radius: 30px;
  padding: 50px 40px;
  text-align: center;
  max-width: 520px;
  width: 90%;
  box-shadow: 0 20px 40px rgba(236,72,153,0.15);
  position: relative;
  z-index: 1;
  animation: fadeIn 1s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(30px);} to { opacity:1; transform:translateY(0);} }
h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 3.2rem;
  background: linear-gradient(to right, #ec4899, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 15px;
}
.message {
  font-size: 1.15rem;
  line-height: 1.7;
  margin-bottom: 30px;
  color: #7c3aed;
}
.buttons {
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}
.btn {
  border: none;
  border-radius: 50px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  color: white;
}
.btn-yes {
  background: linear-gradient(135deg, #ec4899, #a855f7);
  padding: 16px 40px;
  font-size: 1.2rem;
  box-shadow: 0 8px 20px rgba(236,72,153,0.35);
  min-width: 220px;
}
.btn-yes:hover { transform: translateY(-3px); }
.btn-no {
  background: #e5e7eb;
  color: #6b7280;
  padding: 12px 28px;
  font-size: 1rem;
  min-width: 160px;
}
.btn-no:hover { background: #d1d5db; }
.music-btn {
  position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(135deg, #ec4899, #a855f7); color: white; border: none; font-size: 24px;
  cursor: pointer; box-shadow: 0 8px 20px rgba(236,72,153,0.4); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>
<div class="hearts-container" id="hearts"></div>

<div class="card">
  <h1>Em ơi...</h1>
  <p class="message">
    Anh đã chuẩn bị một buổi tối thật đẹp chỉ dành riêng cho em.<br>
    Bắt đầu từ 8h tối, kết thúc muộn nhất 12h đêm...<br><br>
    <strong>Em có đồng ý đi cùng anh không?</strong> 💕
  </p>
  <div class="buttons">
    <button class="btn btn-yes" id="yesBtn" onclick="accept()">Em đồng ý đi!</button>
    <button class="btn btn-no" id="noBtn" onclick="reject()">Không đi</button>
  </div>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="https://archive.org/download/jamendo-595997/01-2237575-SoundBound-Sentimental%20Romantic%20Emotional%20Piano.mp3" type="audio/mpeg">
</audio>
<button class="music-btn" id="musicBtn">🎵</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
let rejectCount = 0;
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

function reject() {
  rejectCount++;
  // Grow the yes button
  const scale = 1 + rejectCount * 0.18;
  yesBtn.style.transform = `scale(${scale})`;
  yesBtn.style.fontSize = (1.2 + rejectCount * 0.15) + 'rem';
  yesBtn.style.padding = (16 + rejectCount * 4) + 'px ' + (40 + rejectCount * 8) + 'px';

  // Fun messages
  const messages = [
    "Em chắc chắn không đi ư?",
    "Thật sự không đi sao... 😢",
    "Anh buồn quá, em suy nghĩ lại đi",
    "Nút 'Em đồng ý' đang lớn hơn đấy!",
    "Em ơi, đi với anh đi mà",
    "Không đi thì anh sẽ buồn lắm đấy...",
    "Em nhấn vào nút hồng đi thôi!"
  ];
  noBtn.textContent = messages[Math.min(rejectCount-1, messages.length-1)];

  // Small confetti of sadness? or just hearts
  if (rejectCount > 2) {
    for (let i = 0; i < 5; i++) setTimeout(createHeart, i * 100);
  }
}

function accept() {
  confetti({
    particleCount: 150,
    spread: 80,
    origin: { y: 0.6 },
    colors: ['#ec4899', '#f472b6', '#c084fc', '#f9a8d4']
  });
  setTimeout(() => {
    window.location.href = 'plan.html';
  }, 800);
}

function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = ['💕','💗','💖'][Math.floor(Math.random()*3)];
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = (Math.random() * 6 + 5) + 's';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 12000);
}
setInterval(createHeart, 800);

// Music
const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
music.volume = 0.25;
musicBtn.addEventListener('click', () => {
  if (music.paused) {
    music.play().catch(()=>{});
    musicBtn.textContent = '⏸️';
  } else {
    music.pause();
    musicBtn.textContent = '🎵';
  }
});
</script>
</body>
</html>
