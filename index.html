<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tối nay đi chơi không?</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #ec4899;
  --bg: linear-gradient(135deg, #fff5f7 0%, #fce7f3 40%, #f3e8ff 100%);
  --card: rgba(255,255,255,0.85);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Poppins', sans-serif;
  background: var(--bg);
  color: #4a2c4a;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.hearts-container {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 0;
}
.heart {
  position: absolute; font-size: 18px; color: #ffb6c1;
  animation: floatUp linear infinite; opacity: 0.6;
}
@keyframes floatUp {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.7; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}
.card {
  background: var(--card);
  backdrop-filter: blur(12px);
  border-radius: 24px;
  padding: 40px 32px;
  text-align: center;
  max-width: 480px;
  width: 100%;
  box-shadow: 0 15px 35px rgba(236,72,153,0.12);
  position: relative;
  z-index: 1;
}
h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 2.8rem;
  background: linear-gradient(to right, #ec4899, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 12px;
}
.message {
  font-size: 1.05rem;
  line-height: 1.65;
  margin-bottom: 28px;
  color: #5b4a5b;
}
.buttons {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-items: center;
}
.btn {
  border: none;
  border-radius: 50px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s;
}
.btn-yes {
  background: linear-gradient(135deg, #ec4899, #a855f7);
  color: white;
  padding: 14px 36px;
  font-size: 1.1rem;
  box-shadow: 0 6px 16px rgba(236,72,153,0.3);
  min-width: 200px;
}
.btn-no {
  background: #f3f4f6;
  color: #6b7280;
  padding: 10px 24px;
  font-size: 0.95rem;
  min-width: 140px;
}
.btn-no:hover { background: #e5e7eb; }
.music-btn {
  position: fixed; bottom: 20px; right: 20px; width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, #ec4899, #a855f7); color: white; border: none; font-size: 22px;
  cursor: pointer; box-shadow: 0 6px 16px rgba(236,72,153,0.35); z-index: 1000;
  display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>
<div class="hearts-container" id="hearts"></div>

<div class="card">
  <h1>Tối nay đi chơi không?</h1>
  <p class="message">
    Anh đã sắp xếp một buổi tối nhẹ nhàng.<br>
    Đón em, ăn gì đó, đi PTB chụp ảnh, rồi đi dạo uống nước.<br>
    Kết thúc khoảng 11h30 - 12h đêm.<br><br>
    Em đi cùng anh không?
  </p>
  <div class="buttons">
    <button class="btn btn-yes" id="yesBtn" onclick="accept()">Đi cùng anh</button>
    <button class="btn btn-no" id="noBtn" onclick="reject()">Thôi</button>
  </div>
</div>

<audio id="bgMusic" loop preload="auto">
  <source src="https://archive.org/download/jamendo-595997/01-2237575-SoundBound-Sentimental%20Romantic%20Emotional%20Piano.mp3" type="audio/mpeg">
</audio>
<button class="music-btn" id="musicBtn">🎵</button>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
let rejectCount = 0;
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');

function reject() {
  rejectCount++;
  const scale = 1 + rejectCount * 0.15;
  yesBtn.style.transform = `scale(${scale})`;
  yesBtn.style.fontSize = (1.1 + rejectCount * 0.1) + 'rem';
  yesBtn.style.padding = (14 + rejectCount * 3) + 'px ' + (36 + rejectCount * 6) + 'px';

  const messages = [
    "Thật không đi ư?",
    "Em suy nghĩ lại đi",
    "Đi chơi thôi mà",
    "Nút đi cùng anh đang to hơn đấy",
    "Em nhấn nút trên đi"
  ];
  noBtn.textContent = messages[Math.min(rejectCount-1, messages.length-1)];
}

function accept() {
  confetti({
    particleCount: 100,
    spread: 70,
    origin: { y: 0.65 },
    colors: ['#ec4899', '#f472b6', '#c084fc']
  });
  setTimeout(() => {
    window.location.href = 'plan.html';
  }, 700);
}

function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = ['💕','💗'][Math.floor(Math.random()*2)];
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.animationDuration = (Math.random() * 7 + 6) + 's';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 13000);
}
setInterval(createHeart, 900);

const music = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
music.volume = 0.2;
musicBtn.addEventListener('click', () => {
  if (music.paused) {
    music.play().catch(()=>{});
    musicBtn.textContent = '⏸️';
  } else {
    music.pause();
    musicBtn.textContent = '🎵';
  }
});
</script>
</body>
</html>
