<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mã QR</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #fff5f7 0%, #fce7f3 40%, #f3e8ff 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.box {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  border-radius: 28px;
  padding: 40px 30px;
  text-align: center;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 15px 40px rgba(236,72,153,0.12);
}
h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 2.6rem;
  background: linear-gradient(to right, #ec4899, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
p {
  color: #7c3aed;
  margin-bottom: 24px;
  font-size: 1rem;
}
#qrcode {
  display: inline-block;
  padding: 16px;
  background: white;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
}
.note {
  margin-top: 20px;
  font-size: 0.85rem;
  color: #9d4edd;
}
</style>
</head>
<body>
<div class="box">
  <h1>Quét để xem</h1>
  <p>Mã QR dẫn đến trang hỏi</p>
  <div id="qrcode"></div>
  <p class="note">Quét bằng điện thoại để mở</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// QR points to the index (question page)
const target = window.location.origin + window.location.pathname.replace(/qr\.html$/, '') || 'https://daniel091012.github.io/ke-hoach-hen-ho/';
new QRCode(document.getElementById("qrcode"), {
  text: target.endsWith('/') ? target : target + '/',
  width: 220,
  height: 220,
  colorDark: "#ec4899",
  colorLight: "#ffffff",
  correctLevel: QRCode.CorrectLevel.H
});
</script>
</body>
</html>
